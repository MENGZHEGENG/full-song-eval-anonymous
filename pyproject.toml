[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "full-song-eval"
version = "0.1.0"
description = "Stem-aware full-song generation evaluation research scaffold."
requires-python = ">=3.10"
dependencies = ["jsonschema>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
